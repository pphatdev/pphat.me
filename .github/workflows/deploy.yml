name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # The repo uses pnpm (pnpm-lock.yaml); there is no package-lock.json,
      # so `npm ci` / `cache: npm` would fail here.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deploy from here, not from Cloudflare's Git integration: Pages' own
      # build compiles _worker.js with wrangler 3, whose old Node polyfills
      # crash the OpenNext worker at runtime (500 on every route). This job
      # uses the project's wrangler 4.
      - name: Build (OpenNext + Pages postbuild)
        run: pnpm run pages:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_API: ${{ secrets.NEXT_PUBLIC_APP_API }}
          NEXT_PPHAT_API_KEY: ${{ secrets.NEXT_PPHAT_API_KEY }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy .open-next/assets --project-name=pphat --branch=master --commit-dirty=true
